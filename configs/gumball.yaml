# Pink gumball test clips. YOLO labels the gumball "orange" (COCO 49), not "sports ball" (32);
# the color_detector range is its measured color (hue 6-10, sat 77-138, val 111-161).
extends: default.yaml

detection:
  class_id: 49
  confidence_threshold: 0.15

color_detector:
  hue_min: 3
  hue_max: 14
  saturation_min: 50
  value_min: 60
