[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "edge-vision"
version = "0.1.0"
description = "Real-time object detection and tracking pipeline (laptop-side foundation for Jetson Orin Nano)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "opencv-python",
    "pyyaml",
]

[project.optional-dependencies]
detection = ["ultralytics"]
dev = ["pytest", "ruff", "mypy", "types-PyYAML"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
ignore = ["E501", "UP006", "UP007", "UP035", "UP045"]  # long lines; typing.List/Optional style kept for 3.9

[tool.mypy]
files = ["src", "scripts"]
ignore_missing_imports = true
